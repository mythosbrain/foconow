name: Publish the verified FocoNow DMG

"on":
  push:
    branches: [main]
    paths: [.github/workflows/publish-foconow-dmg.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: foconow-v1.15.2-release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Attach the checked disk image and publish the private prerelease
        shell: bash
        run: |
          set -euo pipefail
          repo=mythosbrain/foconow
          tag=v1.15.2
          asset=FocoNow-Mac-v1.15.2.dmg
          digest=a8d120c4057fee0576aadd34d1bb0823a8807cc2f05526e2dfa6c5e6a0a307ed
          asset_commit=f3698ec05b731a9039e6815ad426f58dbc07f62c
          source_commit=1b2e42531e371f7dfc097ae6096491fdf13c3a4e
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$(gh api "repos/$repo" --jq '.private')" = true
          test "$(gh api "repos/$repo/commits/$tag" --jq '.sha')" = "$source_commit"

          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$repo/contents/$asset?ref=$asset_commit" > "$asset"
          printf '%s  %s\n' "$digest" "$asset" | sha256sum --check

          releases="$(gh api "repos/$repo/releases")"
          draft="$(jq -ce --arg tag "$tag" --arg digest "$digest" '
            [.[] | select(.draft and .prerelease and .tag_name == $tag
              and .name == "FocoNow 1.15.2 for Mac"
              and (.body | contains($digest)))]
            | if length == 1 then .[0] else error("Expected one matching DMG draft") end
          ' <<< "$releases")"
          id="$(jq -er '.id' <<< "$draft")"
          uploaded="$(jq -c --arg asset "$asset" '.assets[] | select(.name == $asset)' <<< "$draft")"
          if [[ -z "$uploaded" ]]; then
            uploaded="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/x-apple-diskimage' \
              --data-binary "@$asset" "https://uploads.github.com/repos/$repo/releases/$id/assets?name=$asset")"
          fi
          jq -e --arg asset "$asset" --arg digest "sha256:$digest" \
            '.name == $asset and .state == "uploaded" and .digest == $digest' <<< "$uploaded"
          test "$(gh api "repos/$repo" --jq '.private')" = true
          gh api --method PATCH "repos/$repo/releases/$id" -F draft=false -F prerelease=true \
            --jq '.html_url'
