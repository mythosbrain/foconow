<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="336" viewBox="0 0 1280 336" role="img" aria-labelledby="title description">
  <title id="title">FocoNow for Mac</title>
  <desc id="description">Make your time count. A black and white banner with a twenty-five-minute focus timer.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="52%" r="60%">
      <stop stop-color="#202020"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".14"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="334" rx="30" fill="url(#glow)" stroke="#383838" stroke-width="2"/>
  <path d="M704 2h544a30 30 0 0 1 30 30v272a30 30 0 0 1-30 30H704z" fill="url(#grid)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="72" y="54" width="42" height="42" rx="12" fill="#f8f8f8"/>
    <path d="M83 71v-5a1 1 0 0 1 1-1h5m8 0h5a1 1 0 0 1 1 1v5m0 8v5a1 1 0 0 1-1 1h-5m-8 0h-5a1 1 0 0 1-1-1v-5" fill="none" stroke="#080808" stroke-width="1.9" stroke-linecap="round"/>
    <circle cx="93" cy="75" r="3.5" fill="none" stroke="#080808" stroke-width="1.9"/>
    <text x="132" y="80" fill="#a6a6a6" font-size="16" font-weight="650" letter-spacing="3">YOUR DAILY WORKSPACE</text>
    <text x="68" y="191" fill="#f8f8f8" font-size="92" font-weight="740" letter-spacing="-5">FocoNow</text>
    <text x="73" y="243" fill="#d1d1d1" font-size="31" font-weight="500" letter-spacing="-.6">Make your time count.</text>
    <text x="74" y="289" fill="#a6a6a6" font-size="13" font-weight="600" letter-spacing="2.7">PLAN  ·  FOCUS  ·  REFLECT</text>
    <rect x="854" y="37" width="338" height="262" rx="22" fill="#111111" stroke="#393939"/>
    <circle cx="883" cy="64" r="3" fill="#e6e6e6"/>
    <text x="895" y="68" fill="#b6b6b6" font-size="12" font-weight="620" letter-spacing="2">FOCUS SESSION</text>
    <path d="M876 85h294" stroke="#292929"/>
    <circle cx="1023" cy="184" r="73" fill="#0a0a0a" stroke="#303030" stroke-width="3"/>
    <circle cx="1023" cy="184" r="73" fill="none" stroke="#f1f1f1" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="73 27" transform="rotate(-90 1023 184)"/>
    <text x="1023" y="191" text-anchor="middle" fill="#f5f5f5" font-size="38" font-weight="570" letter-spacing="-1.6">25:00</text>
    <text x="1023" y="214" text-anchor="middle" fill="#a6a6a6" font-size="11" font-weight="650" letter-spacing="2.1">MINUTES</text>
    <text x="1023" y="282" text-anchor="middle" fill="#a6a6a6" font-size="12" letter-spacing="1.1">ONE TASK AT A TIME</text>
