<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open FocoNow</title><style>
:root{color-scheme:dark;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#090a0d;color:#f5f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(640px,100%);padding:32px;border:1px solid #ffffff25;border-radius:25px;background:linear-gradient(145deg,#252830,#111319);box-shadow:0 30px 80px #0008}h1{margin:0 0 10px;font-size:29px;letter-spacing:-1px}p{color:#b8bfce;line-height:1.6;margin:0 0 22px}label{display:block;font-size:12px;color:#aeb7c9;margin-bottom:10px}.command{padding:15px;border:1px solid #ffffff25;border-radius:13px;background:#090b10}textarea{resize:none;width:100%;height:80px;border:0;background:transparent;color:#e6ebf5;font:13px/1.8 ui-monospace,Menlo,monospace;overflow-wrap:anywhere}button{font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;background:#eff2f9;color:#101217;border:0;padding:14px 22px;border-radius:12px;cursor:pointer;margin-top:18px}button:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:5px}#status{margin:12px 0 0;font-size:12px;min-height:20px}small{display:block;font-size:11px;color:#949fb2;line-height:1.6;margin-top:18px}@media(max-width:480px){.panel{padding:22px}textarea{height:125px;font-size:12px}}
</style></head><body><main class="panel"><h1>Open FocoNow.</h1><p>Drag the app into Applications first.</p><div class="command"><label for="command">First-launch command</label><textarea id="command" readonly spellcheck="false">xattr -dr com.apple.quarantine "/Applications/FocoNow.app" &amp;&amp; open "/Applications/FocoNow.app"</textarea></div><button id="copy" type="button">Copy command</button><p id="status" role="status" aria-live="polite"></p><p>Double-click <strong>Open Terminal</strong> in the disk image.<br>Paste with <strong>⌘ V</strong>, then press <strong>Return</strong>.</p><small>For a trusted FocoNow download only. Removes quarantine from FocoNow; it does not scan the app or disable global Mac security.</small></main><script>
const field=document.querySelector('#command'),button=document.querySelector('#copy'),status=document.querySelector('#status');
button.addEventListener('click',async()=>{
 try{
  if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(field.value);
  else{field.focus();field.select();if(!document.execCommand('copy'))throw Error('Copy unavailable');}
  button.textContent='Copied ✓';status.textContent='Paste in Terminal, then press Return.';
 }catch{field.focus();field.select();status.textContent='Press ⌘ C to copy the selected command.';}
});
</script></body></html>
